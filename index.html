  <style>
    :root {
      --bg-dark: #03060d;
      --card-bg: rgba(10, 17, 32, 0.9);
      --border-subtle: rgba(51, 65, 85, 0.75);
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --accent-sky: #38bdf8;
      --accent-emerald: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      line-height: 1.6;
      position: relative;
      overflow-x: hidden;
    }

    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }

    /* Abstract Blue Light-Pipe Speed-Zoom Background */
    .light-pipe-bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(ellipse at 75% 25%, rgba(14, 165, 233, 0.22) 0%, rgba(2, 132, 199, 0.08) 38%, transparent 70%),
        radial-gradient(ellipse at 20% 80%, rgba(56, 189, 248, 0.14) 0%, transparent 55%),
        linear-gradient(180deg, #02040a 0%, #050b18 50%, #02040a 100%);
      overflow: hidden;
      pointer-events: none;
    }

    .light-pipe-bg::before {
      content: "";
      position: absolute;
      inset: -30%;
      background-image:
        repeating-linear-gradient(
          -28deg,
          transparent 0px,
          transparent 48px,
          rgba(56, 189, 248, 0.07) 49px,
          rgba(14, 165, 233, 0.18) 51px,
          transparent 53px,
          transparent 120px
        ),
        repeating-linear-gradient(
          -28deg,
          transparent 0px,
          transparent 95px,
          rgba(125, 211, 252, 0.12) 96px,
          transparent 98px,
          transparent 210px
        );
      filter: blur(0.4px);
      mask-image: radial-gradient(circle at 65% 40%, black 25%, transparent 80%);
      -webkit-mask-image: radial-gradient(circle at 65% 40%, black 25%, transparent 80%);
    }

    .light-pipe-bg::after {
      content: "";
      position: absolute;
      top: -10%;
      right: -15%;
      width: 85%;
      height: 120%;
      background:
        linear-gradient(-28deg, transparent 44%, rgba(56, 189, 248, 0.14) 48%, rgba(186, 230, 253, 0.25) 49.5%, rgba(14, 165, 233, 0.12) 51%, transparent 55%),
        linear-gradient(-28deg, transparent 58%, rgba(56, 189, 248, 0.08) 60%, rgba(56, 189, 248, 0.16) 60.8%, transparent 63%);
      filter: blur(6px);
      pointer-events: none;
    }

    /* Explicit Icon Sizing */
    .icon-sm {
      width: 16px;
      height: 16px;
      min-width: 16px;
      min-height: 16px;
      flex-shrink: 0;
      fill: currentColor;
      display: inline-block;
    }

    .container {
      max-width: 1120px;
      width: 100%;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(3, 6, 13, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(30, 41, 59, 0.9);
    }

    .header-inner {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 24px;
    }
